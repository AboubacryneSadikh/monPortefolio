# sonar-project.properties
sonar.projectKey=portfolio
sonar.projectName=Portfolio CI/CD K8S
sonar.host.url=http://sonarqube:9000

# Sources separees par module
sonar.sources=frontend/src,backend

# Exclusions etendues pour eviter les scans inutiles
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/.git/**,\
  **/build/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/public/**

# Desactiver le provisioning JRE automatique
sonar.scanner.skipJreProvisioning=true

# Memoire Node.js pour l'analyse JS/TS
sonar.javascript.node.maxspace=512

# Forcer l'analyse sans TypeScript (pas de tsconfig.json)
sonar.typescript.tsconfigPath=

# Limiter l'analyse aux fichiers modifies recemment (optionnel)
sonar.scm.disabled=true
